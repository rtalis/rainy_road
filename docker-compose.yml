version: "3.8"

services:
  web:
    build: .
    container_name: rainy-road-web
    ports:
      - "8000:8000"
    environment:
      - OW_API_KEY=${OW_API_KEY}
      - PHOTON_ENABLED=${PHOTON_ENABLED}
      - OPEN_METEO_ENABLED=${OPEN_METEO_ENABLED}
      - GW_API_KEY=${GW_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - GENERATED_MAPS_DIR=${GENERATED_MAPS_DIR:-generated_maps}
      - MAP_MAX_AGE_SECONDS=${MAP_MAX_AGE_SECONDS:-7200}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://shared_redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://shared_redis:6379/0}
      - CELERY_RESULT_EXPIRES=${CELERY_RESULT_EXPIRES:-7200}
      - CARTO_API_KEY=${CARTO_API_KEY}
      - CARTO_STYLE=${CARTO_STYLE:-voyager}
    volumes:
      - ./generated_maps:/app/generated_maps
      - ./cache:/app/cache
    networks:
      - default
      - shared-net
    restart: unless-stopped

  celery:
    build: .
    container_name: rainy-road-celery
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - OW_API_KEY=${OW_API_KEY}
      - PHOTON_ENABLED=${PHOTON_ENABLED}
      - OPEN_METEO_ENABLED=${OPEN_METEO_ENABLED}
      - GW_API_KEY=${GW_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - GENERATED_MAPS_DIR=${GENERATED_MAPS_DIR:-generated_maps}
      - MAP_MAX_AGE_SECONDS=${MAP_MAX_AGE_SECONDS:-7200}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://shared_redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://shared_redis:6379/0}
      - CELERY_RESULT_EXPIRES=${CELERY_RESULT_EXPIRES:-7200}
      - CARTO_API_KEY=${CARTO_API_KEY}
      - CARTO_STYLE=${CARTO_STYLE:-voyager}
    volumes:
      - ./generated_maps:/app/generated_maps
      - ./cache:/app/cache
    networks:
      - default
      - shared-net
    restart: unless-stopped

networks:
  default:
  shared-net:
    external: true
